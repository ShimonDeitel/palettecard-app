name: PaletteCard
options:
  bundleIdPrefix: com.shimondeitel.paintmixlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PaletteCard:
    type: application
    platform: iOS
    sources:
      - path: PaletteCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.paintmixlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PaletteCard/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PaletteCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaletteCardTests
      - path: PaletteCard.storekit
    dependencies:
      - target: PaletteCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.paintmixlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PaletteCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PaletteCardUITests
    dependencies:
      - target: PaletteCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.paintmixlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PaletteCard:
    build:
      targets:
        PaletteCard: all
        PaletteCardTests: [test]
        PaletteCardUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PaletteCard.storekit
    test:
      config: Debug
      storeKitConfiguration: PaletteCard.storekit
      targets:
        - PaletteCardTests
        - PaletteCardUITests
    archive:
      config: Release
